name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify synthetic PCAP fixtures
        run: python3 scripts/generate_examples.py --check

      - name: Verify benchmark inputs and live-run classification
        run: |
          python3 scripts/perf/test_workloads.py
          python3 scripts/perf/test_live_capture.py

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked

      - name: Release build
        run: cargo build --locked --release

      - name: Rootless offline smoke
        run: |
          out="$RUNNER_TEMP/netscope-smoke"
          mkdir -p "$out"
          ./target/release/netscope \
            --read-pcap examples/pcaps/normal.pcap \
            --quiet \
            --summary-json "$out/summary.json" \
            --export-json "$out/flows.json"
          python3 - "$out" <<'PY'
          import json
          import pathlib
          import sys

          out = pathlib.Path(sys.argv[1])
          summary = json.loads((out / "summary.json").read_text())
          flows = json.loads((out / "flows.json").read_text())
          assert summary["status"] == "success", summary
          assert summary["frames_read"] == 8, summary
          assert summary["packets_parsed"] == 8, summary
          assert summary["packet_parse_errors"] == 0, summary
          assert summary["alerts_emitted"] == 0, summary
          assert summary["output_errors"] == [], summary
          assert {flow["protocol"] for flow in flows} == {"tcp", "udp"}, flows
          PY
