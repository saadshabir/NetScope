name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify synthetic PCAP fixtures
        run: python3 scripts/generate_examples.py --check

      - name: Check benchmark workload helpers
        run: python3 -m unittest discover -s scripts/perf -p 'test_*.py'

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked

      - name: Release build
        run: cargo build --locked --release

      - name: Offline example smoke (no capture privileges)
        shell: bash
        run: |
          output_dir="$(mktemp -d)"
          trap 'rm -rf "$output_dir"' EXIT
          for example in normal port-scan syn-flood protocol-edges; do
            ./target/release/netscope \
              --read-pcap "examples/pcaps/${example}.pcap" \
              --quiet \
              --summary-json "$output_dir/${example}.json"
          done
