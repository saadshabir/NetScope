[package]
name = "netscope"
version = "0.1.0"
edition = "2024"
description = "High-performance network packet capture and protocol analysis tool"

[lib]
name = "netscope"
path = "src/lib.rs"

[[bin]]
name = "netscope"
path = "src/main.rs"

[features]
default = ["dashboard"]
dashboard = ["dep:axum", "dep:axum-server", "dep:tokio", "dep:rust-embed", "dep:mime_guess", "dep:base64"]

[dependencies]
# Packet capture
pcap = "2"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging / tracing
tracing = "0.1"
tracing-subscriber = "0.3"

# Serialization (for future flow export)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Signal handling
ctrlc = "3"

# Formatting
hex = "0.4"

# Fast hashing (portable performance)
ahash = "0.8"

# Lock-free channels for sharded pipeline
crossbeam-channel = "0.5"

# Web dashboard
axum = { version = "0.8", features = ["ws"], optional = true }
axum-server = { version = "0.8", features = ["tls-rustls"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"], optional = true }
rust-embed = { version = "8", optional = true }
mime_guess = { version = "2", optional = true }
base64 = { version = "0.22", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(unix))'.dependencies]
same-file = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tower = { version = "0.5", features = ["util"] }
futures-util = "0.3"
tokio-tungstenite = "0.28"

[[bench]]
name = "hot_path"
harness = false
