[package]
name = "netscope"
version = "0.1.0"
edition = "2024"
description = "High-performance network packet capture and protocol analysis tool"

[lib]
name = "netscope"
path = "src/lib.rs"

[[bin]]
name = "netscope"
path = "src/main.rs"

[dependencies]
# Packet capture
pcap = "2"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization (for future flow export)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Signal handling
ctrlc = "3"

# Formatting
hex = "0.4"

# Fast hashing (portable performance)
ahash = "0.8"

# Lock-free channels for sharded pipeline
crossbeam-channel = "0.5"

# CPU topology
num_cpus = "1"

# Web dashboard
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
tokio = { version = "1", features = ["full"] }
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"
base64 = "0.22"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tower = { version = "0.5", features = ["util"] }
futures-util = "0.3"
tokio-tungstenite = "0.23"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(libpcap_1_2_1)', 'cfg(libpcap_1_5_0)', 'cfg(libpcap_1_5_3)', 'cfg(libpcap_1_7_2)', 'cfg(libpcap_1_9_0)', 'cfg(libpcap_1_9_1)'] }

[[bench]]
name = "hot_path"
harness = false
